  - absorbed
memory_reveal: Phong ấn không bị phá; lời hứa bảo hộ đã bị bỏ mặc.
aftermath_variants:
  released: Thủy tộc mở đường và trao LG-01 như một lời gửi gắm.
  defeated_by_force: LG-01 tắt một phần; Long Nhân nhận sức mạnh nhưng mất một ký ức.
  absorbed: Long Khí bùng lên; dragon_hunger tăng và nước quanh tế đàn hóa đen.
